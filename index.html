<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a0a00;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .ripple {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%) scale(0);
      animation: rippleOut 0.7s ease-out forwards;
    }
    @keyframes rippleOut {
      to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, mouse = { x: -999, y: -999 };
      let rafId = null;
      let isVisible = true;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // Stars
      const STAR_COUNT = 180;
      const stars = Array.from({ length: STAR_COUNT }, () => ({
        x: Math.random() * 9999,
        y: Math.random() * 9999,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random()
      }));

      // Shooting stars
      const shoots = [];
      function spawnShoot() {
        if (!isVisible) return;
        const side = Math.random();
        let x, y, angle;
        if (side < 0.5) {
          x = Math.random() * W; y = 0;
          angle = Math.PI / 4 + (Math.random() - 0.5) * 0.4;
        } else {
          x = 0; y = Math.random() * H * 0.5;
          angle = Math.PI / 6 + (Math.random() - 0.5) * 0.3;
        }
        shoots.push({
          x, y,
          vx: Math.cos(angle) * (5 + Math.random() * 6),
          vy: Math.sin(angle) * (5 + Math.random() * 6),
          len: 60 + Math.random() * 100,
          life: 1,
          decay: 0.016 + Math.random() * 0.02,
          color: Math.random() < 0.5 ? '#ff6b1a' : Math.random() < 0.5 ? '#ff9500' : '#ffffff'
        });
      }
      setInterval(spawnShoot, 1100);
      for (let i = 0; i < 3; i++) setTimeout(spawnShoot, i * 280);

      // Mouse particles
      const particles = [];
      const MAX_PARTICLES = 45;
      let lastMX = -999, lastMY = -999;
      window.addEventListener('mousemove', e => {
        mouse.x = e.clientX; mouse.y = e.clientY;
        const dx = mouse.x - lastMX, dy = mouse.y - lastMY;
        const speed = Math.sqrt(dx * dx + dy * dy);
        if (speed > 5 && particles.length < MAX_PARTICLES) {
          const count = Math.min(Math.floor(speed / 8), 3);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 1.5 + 0.4;
            particles.push({
              x: mouse.x, y: mouse.y,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd - 0.4,
              life: 1,
              decay: 0.038 + Math.random() * 0.04,
              r: Math.random() * 2.2 + 0.5,
              color: ['#ff6b1a', '#ff9500', '#ff4500', '#ffa500'][Math.floor(Math.random() * 4)]
            });
          }
        }
        lastMX = mouse.x; lastMY = mouse.y;
      });

      let glowAlpha = 0;
      window.addEventListener('mousemove', () => { glowAlpha = 1; });

      // Click ripple
      window.addEventListener('click', e => {
        const el = document.createElement('div');
        el.className = 'ripple';
        const size = 140 + Math.random() * 60;
        el.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;width:${size}px;height:${size}px;border:2px solid rgba(255,107,26,0.55);box-shadow:0 0 12px rgba(255,107,26,0.3);`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          isVisible = false;
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          particles.length = 0;
          shoots.length = 0;
        } else {
          isVisible = true;
          lastMX = -999; lastMY = -999;
          glowAlpha = 0;
          if (!rafId) draw();
        }
      });

      let t = 0;
      function draw(ts) {
        if (!isVisible) return;
        rafId = requestAnimationFrame(draw);
        ctx.clearRect(0, 0, W, H);

        // Vibrant orange gradient background
        const bg = ctx.createRadialGradient(W * 0.5, 0, 0, W * 0.5, H * 0.4, H);
        bg.addColorStop(0, '#3d1800');
        bg.addColorStop(0.4, '#2a0f00');
        bg.addColorStop(1, '#1a0a00');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // Twinkling stars
        t += 0.006;
        stars.forEach(s => {
          const twinkle = s.a + Math.sin(t * 1.5 + s.x) * 0.35;
          ctx.globalAlpha = Math.max(0.08, Math.min(0.9, twinkle));
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Shooting stars
        for (let i = shoots.length - 1; i >= 0; i--) {
          const s = shoots[i];
          const spd = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
          const tailX = s.x - s.vx * (s.len / spd);
          const tailY = s.y - s.vy * (s.len / spd);
          const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
          grad.addColorStop(0, 'rgba(0,0,0,0)');
          const rgb = s.color === '#ffffff' ? '255,255,255' : s.color === '#ff9500' ? '255,149,0' : '255,107,26';
          grad.addColorStop(1, `rgba(${rgb},${s.life})`);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.6 * s.life;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 10 * s.life;
          ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(s.x, s.y); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = s.life * 0.85;
          const hg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 4);
          hg.addColorStop(0, '#ffffff'); hg.addColorStop(1, 'transparent');
          ctx.fillStyle = hg;
          ctx.beginPath(); ctx.arc(s.x, s.y, 4 * s.life, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
          s.x += s.vx; s.y += s.vy; s.life -= s.decay;
          if (s.life <= 0 || s.x > W + 200 || s.y > H + 200) shoots.splice(i, 1);
        }

        // Mouse glow
        if (mouse.x > 0) {
          glowAlpha *= 0.94;
          if (glowAlpha > 0.01) {
            const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 110);
            mg.addColorStop(0, `rgba(255,107,26,${glowAlpha * 0.18})`);
            mg.addColorStop(0.5, `rgba(255,149,0,${glowAlpha * 0.07})`);
            mg.addColorStop(1, 'transparent');
            ctx.fillStyle = mg;
            ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 110, 0, Math.PI * 2); ctx.fill();
          }
        }

        // Mouse trail particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          ctx.globalAlpha = p.life * 0.8;
          ctx.shadowColor = p.color; ctx.shadowBlur = 7;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
          if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;
      }
      draw();
    })();
  </script>
</body>
</html>
