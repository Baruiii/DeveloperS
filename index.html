<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudioLeaks — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a0a00;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .ripple {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%) scale(0);
      animation: rippleOut 0.7s ease-out forwards;
    }
    @keyframes rippleOut {
      to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
    .login-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 380px;
      padding: 2.75rem 2.25rem 2rem;
      background: rgba(20, 8, 0, 0.82);
      border: 1.5px solid rgba(255, 107, 26, 0.45);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow:
        0 0 0 1px rgba(255, 107, 26, 0.08),
        0 25px 50px -12px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(255, 107, 26, 0.12);
      text-align: center;
    }
    .login-title span {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 180, 120, 0.7);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }
    .login-brand {
      font-family: 'Archivo Black', sans-serif;
      font-size: 32px;
      color: #ff6b1a;
      text-shadow: 0 0 28px rgba(255, 107, 26, 0.5);
      margin-bottom: 2.5rem;
    }
    .field {
      margin-bottom: 1.1rem;
      text-align: left;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 180, 120, 0.65);
      margin-bottom: 0.4rem;
      letter-spacing: 0.04em;
    }
    .field input {
      width: 100%;
      padding: 0.9rem 1.1rem;
      background: rgba(255, 107, 26, 0.06);
      border: 1.5px solid rgba(255, 107, 26, 0.35);
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .field input::placeholder { color: rgba(255, 180, 120, 0.35); }
    .field input:focus {
      border-color: #ff6b1a;
      background: rgba(255, 107, 26, 0.1);
      box-shadow: 0 0 0 3px rgba(255, 107, 26, 0.15);
    }
    .login-btn {
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.95rem;
      background: linear-gradient(135deg, #ff6b1a, #ff9500);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Archivo Black', sans-serif;
      font-size: 16px;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(255, 107, 26, 0.35);
    }
    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 107, 26, 0.45);
    }
    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .error-msg {
      margin-top: 1rem;
      font-size: 13px;
      font-weight: 500;
      color: #ff4d4d;
      min-height: 1.3em;
      opacity: 0;
      transform: translateX(0);
      transition: opacity 0.15s;
    }
    .error-msg.show {
      opacity: 1;
      animation: shake 0.45s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .login-footer {
      margin-top: 1.75rem;
      font-size: 12px;
      color: rgba(255, 180, 120, 0.4);
      letter-spacing: 0.04em;
    }

    /* Floating music button on login */
    .music-btn {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 30;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(20, 8, 0, 0.75);
      border: 1.5px solid rgba(255, 107, 26, 0.45);
      color: rgba(255, 180, 120, 0.75);
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
    }
    .music-btn:hover,
    .music-btn.active {
      color: #ff6b1a;
      border-color: #ff6b1a;
      background: rgba(255, 107, 26, 0.18);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <button class="music-btn" id="music-btn" title="Toggle music" aria-label="Toggle music">♪</button>

  <audio id="bg-music" loop preload="auto">
    <source src="music/bg.mp3" type="audio/mpeg">
  </audio>

  <div class="login-card">
    <div class="login-title">
      <span>Login to</span>
    </div>
    <div class="login-brand">StudioLeaks</div>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter email" autocomplete="username" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      <div class="error-msg" id="error-msg"></div>
    </form>
    <div class="login-footer">StudioLeaks — 2026</div>
  </div>

  <script>
    // ========== SUPABASE ==========
    const SUPABASE_URL = 'https://rkdvqfmmuioyxjqxtuuc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrZHZxZm1tdWlveXhqcXh0dXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjQ3MzUsImV4cCI6MjEwMDk0MDczNX0.vyiN812DdhbiqMnqI9w2YY2eVMRx4IC-2Y6qyEVaSVU';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('error-msg');

    function showError(text) {
      errorEl.textContent = text;
      errorEl.classList.remove('show');
      void errorEl.offsetWidth;
      errorEl.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      errorEl.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        showError('Please enter email and password');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });
        if (error) {
          const msg = error.message.toLowerCase();
          if (msg.includes('invalid login') || msg.includes('invalid credentials') || msg.includes('email')) {
            showError('Incorrect email or password');
          } else {
            showError(error.message);
          }
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError('Something went wrong. Check your connection.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
        console.error(err);
      }
    });

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'dashboard.html';
    });

    // ========== BACKGROUND MUSIC ==========
    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-btn');
    music.volume = 0.35;

    function setMusicUI(on) {
      musicBtn.classList.toggle('active', on);
      musicBtn.title = on ? 'Mute music' : 'Play music';
    }

    function tryPlayMusic() {
      music.play().then(() => {
        setMusicUI(true);
        localStorage.setItem('studioleaks-music', 'on');
      }).catch(() => {
        setMusicUI(false);
      });
    }

    if (localStorage.getItem('studioleaks-music') === 'on') {
      tryPlayMusic();
    }

    musicBtn.addEventListener('click', () => {
      if (music.paused) {
        tryPlayMusic();
      } else {
        music.pause();
        setMusicUI(false);
        localStorage.setItem('studioleaks-music', 'off');
      }
    });

    // After any click, resume if they previously turned music on
    document.addEventListener('click', function resumeOnce() {
      if (localStorage.getItem('studioleaks-music') === 'on' && music.paused) {
        tryPlayMusic();
      }
      document.removeEventListener('click', resumeOnce);
    }, { once: true });

    // ========== BACKGROUND CANVAS ==========
    (function () {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let W, H, mouse = { x: -999, y: -999 };
      let rafId = null;
      let isVisible = true;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const stars = Array.from({ length: 180 }, () => ({
        x: Math.random() * 9999,
        y: Math.random() * 9999,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random()
      }));
      const shoots = [];
      function spawnShoot() {
        if (!isVisible) return;
        const side = Math.random();
        let x, y, angle;
        if (side < 0.5) {
          x = Math.random() * W; y = 0;
          angle = Math.PI / 4 + (Math.random() - 0.5) * 0.4;
        } else {
          x = 0; y = Math.random() * H * 0.5;
          angle = Math.PI / 6 + (Math.random() - 0.5) * 0.3;
        }
        shoots.push({
          x, y,
          vx: Math.cos(angle) * (5 + Math.random() * 6),
          vy: Math.sin(angle) * (5 + Math.random() * 6),
          len: 60 + Math.random() * 100,
          life: 1,
          decay: 0.016 + Math.random() * 0.02,
          color: Math.random() < 0.5 ? '#ff6b1a' : Math.random() < 0.5 ? '#ff9500' : '#ffffff'
        });
      }
      setInterval(spawnShoot, 1100);
      for (let i = 0; i < 3; i++) setTimeout(spawnShoot, i * 280);

      const particles = [];
      let lastMX = -999, lastMY = -999;
      window.addEventListener('mousemove', e => {
        mouse.x = e.clientX; mouse.y = e.clientY;
        const dx = mouse.x - lastMX, dy = mouse.y - lastMY;
        const speed = Math.sqrt(dx * dx + dy * dy);
        if (speed > 5 && particles.length < 45) {
          const count = Math.min(Math.floor(speed / 8), 3);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 1.5 + 0.4;
            particles.push({
              x: mouse.x, y: mouse.y,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd - 0.4,
              life: 1,
              decay: 0.038 + Math.random() * 0.04,
              r: Math.random() * 2.2 + 0.5,
              color: ['#ff6b1a', '#ff9500', '#ff4500', '#ffa500'][Math.floor(Math.random() * 4)]
            });
          }
        }
        lastMX = mouse.x; lastMY = mouse.y;
      });

      let glowAlpha = 0;
      window.addEventListener('mousemove', () => { glowAlpha = 1; });

      window.addEventListener('click', e => {
        const el = document.createElement('div');
        el.className = 'ripple';
        const size = 140 + Math.random() * 60;
        el.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;width:${size}px;height:${size}px;border:2px solid rgba(255,107,26,0.55);box-shadow:0 0 12px rgba(255,107,26,0.3);`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          isVisible = false;
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          particles.length = 0;
          shoots.length = 0;
        } else {
          isVisible = true;
          lastMX = -999; lastMY = -999;
          glowAlpha = 0;
          if (!rafId) draw();
        }
      });

      let t = 0;
      function draw() {
        if (!isVisible) return;
        rafId = requestAnimationFrame(draw);
        ctx.clearRect(0, 0, W, H);
        const bg = ctx.createRadialGradient(W * 0.5, 0, 0, W * 0.5, H * 0.4, H);
        bg.addColorStop(0, '#3d1800');
        bg.addColorStop(0.4, '#2a0f00');
        bg.addColorStop(1, '#1a0a00');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        t += 0.006;
        stars.forEach(s => {
          const twinkle = s.a + Math.sin(t * 1.5 + s.x) * 0.35;
          ctx.globalAlpha = Math.max(0.08, Math.min(0.9, twinkle));
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        for (let i = shoots.length - 1; i >= 0; i--) {
          const s = shoots[i];
          const spd = Math.sqrt(s.vx * s.vx + s.vy * s.vy) || 1;
          const tailX = s.x - s.vx * (s.len / spd);
          const tailY = s.y - s.vy * (s.len / spd);
          const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
          grad.addColorStop(0, 'rgba(0,0,0,0)');
          const rgb = s.color === '#ffffff' ? '255,255,255' : s.color === '#ff9500' ? '255,149,0' : '255,107,26';
          grad.addColorStop(1, `rgba(${rgb},${s.life})`);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.6 * s.life;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 10 * s.life;
          ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(s.x, s.y); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = s.life * 0.85;
          const hg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 4);
          hg.addColorStop(0, '#ffffff'); hg.addColorStop(1, 'transparent');
          ctx.fillStyle = hg;
          ctx.beginPath(); ctx.arc(s.x, s.y, 4 * s.life, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
          s.x += s.vx; s.y += s.vy; s.life -= s.decay;
          if (s.life <= 0 || s.x > W + 200 || s.y > H + 200) shoots.splice(i, 1);
        }
        if (mouse.x > 0) {
          glowAlpha *= 0.94;
          if (glowAlpha > 0.01) {
            const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 110);
            mg.addColorStop(0, `rgba(255,107,26,${glowAlpha * 0.18})`);
            mg.addColorStop(0.5, `rgba(255,149,0,${glowAlpha * 0.07})`);
            mg.addColorStop(1, 'transparent');
            ctx.fillStyle = mg;
            ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 110, 0, Math.PI * 2); ctx.fill();
          }
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          ctx.globalAlpha = p.life * 0.8;
          ctx.shadowColor = p.color; ctx.shadowBlur = 7;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
          if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;
      }
      draw();
    })();
  </script>
</body>
</html>
